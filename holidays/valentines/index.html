<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Valentine's Day tribute to Christina from John Liter, filled with love and hearts.">
    <meta name="keywords" content="Valentine's Day, Christina, John Liter, love, tribute">
    <meta property="og:title" content="Happy Valentine's Day, Christina!">
    <meta property="og:description" content="A romantic message from John to his beloved wife, Christina.">
    <meta property="og:image" content="photos/vday.png">
    <meta property="og:type" content="website">
    <title>Happy Valentine's Day, Christina!</title>
    <link rel="preload" href="photos/vday.png" as="image">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Back Button -->
    <a href="https://johnliter.github.io/mylovehp/" rel="noopener noreferrer" class="back-button" aria-label="Return to homepage">
        <div class="heart-icon">
            <span class="back-text"></span>
        </div>
    </a>

    <!-- Background and Overlay -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Hearts Canvas (moved up for layering) -->
    <canvas id="hearts-canvas" aria-hidden="true"></canvas>

    <!-- Main Content -->
    <main class="container">
        <h1 class="fade-in">Happy Valentine's Day, My Love!</h1>
        <p class="fade-in delay-1">My Dearest Wife,</p>
        <p class="fade-in delay-2">I am so blessed to have you in my life. You are my everything, and I will always be your Valentine. Thank you for being the most amazing partner, friend, and love of my life. I cherish every moment with you.</p>
        <p class="fade-in delay-3">Forever Yours,</p>
        <p class="fade-in delay-4">Your Loving Husband</p>
    </main>

    <!-- Back-to-Top Button -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

    <!-- Scripts -->
    <script src="script.js" defer></script>
</body>
</html>
